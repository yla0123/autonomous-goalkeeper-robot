# Design example only. No node consumes this file yet.
# Values are illustrative simulation and planning parameters.
# null entries must be filled from the selected model and timing assumptions.
schema_version: 3
mode: manual_sim
hardware_enabled: false

frames:
  world: world
  goal: goal_frame
  goal_origin_world_m: [10.0, 0.0, 0.0]
  goal_orientation_world_rad: [0.0, 0.0, 0.0]

joints:
  slide_name: slide_joint
  tilt_name: tilt_joint
  slide_axis: [0.0, 1.0, 0.0]
  tilt_axis: [1.0, 0.0, 0.0]

geometry:
  # The complete body-part footprint is defined in keeper.design.json.
  goal_width_m: 7.32
  goal_height_m: 2.44
  keeper_height_m: 1.90
  keeper_arm_span_m: 1.90
  pivot_height_m: 1.00
  ball_radius_m: 0.11

motion:
  slide_min_m: -3.20
  slide_max_m: 3.20
  slide_max_speed_mps: 2.0
  slide_max_acceleration_mps2: 12.0
  tilt_min_rad: -0.7853981633974483
  tilt_max_rad: 0.7853981633974483
  tilt_max_speed_radps: 4.0
  tilt_max_acceleration_radps2: 20.0
  settling_margin_ms: 20

serial:
  port: null
  baud_rate: 115200
  protocol_version: 2
  max_line_bytes: 160
  link_watchdog_ms: 600
  max_command_ttl_ms: 600
  transport_margin_ms: null
  status_rate_hz: 20

planning:
  observation_max_age_ms: 100
  command_max_age_ms: 100
  minimum_forward_speed_mps: null
  predictor_model: rolling_linear
  allow_unreachable_target_motion: false
